[project]
name = "counterparty-resolver"
version = "0.1.0"
description = "Decide whether two records are the same counterparty, on labels a registrar wrote."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterparty_resolver"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"scripts/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: reaches a public data source",
]
