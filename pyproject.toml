[project]
name = "counterparty-resolver"
version = "0.1.0"
description = "Decide whether two records are the same counterparty, on labels a registrar wrote."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.53.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.11",
  "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterparty_resolver"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# N802: the kill tests are named for ADR-001's conditions A-F; lowercasing them would
# disconnect the test from the criterion it exists to enforce.
"tests/*" = ["S101", "PLR2004", "N802"]
"scripts/*" = ["S101", "PLR2004"]
# S608: the crosswalk views are assembled from module constants in `store/schema.py` -- a column
# count and a registration-authority code. No value here comes from a request, and writing the
# ten UNION branches by hand would let them drift from the schema they unpivot.
"src/counterparty_resolver/store/crosswalk.py" = ["S608"]
# E501: the breach anchors are copied verbatim from the files they patch, and the script fails
# loudly when one no longer applies. Wrapping them across lines to satisfy a line limit would
# make a silent typo look like a deliberate edit.
"scripts/plant_breaches.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: reaches a public data source",
]
